[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesturedraw"
version = "0.2.0"
description = "Real-time hand-gesture air canvas using MediaPipe, OpenCV, and NumPy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohammad Liaquat Ali" }]

[tool.setuptools]
py-modules = [
    "config",
    "canvas",
    "frame_capture",
    "hand_tracker",
    "shapes",
    "main",
    "gesture_draw_v2",
]

[tool.setuptools.packages.find]
include = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]